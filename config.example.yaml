logging:
  default_level: "INFO"

satel:
  host: "192.168.1.10"
  port: 7094
  integration_key: "TWOJ_KOD_UZYTKOWNIKA"
  encryption_key: null
  encryption_enabled: false
  partition: 1

  virtual_inputs:
    mode: library
    port: 8888
    url_template: "http://{host}:{port}/{name}"
    inputs:
      motion_hall_camera:      17
      motion_tuya_pir_garage:  18
      light_on_living_room:    19

  outputs:
    panic_output: 5

  monitored_zones:
    Salon: 12
    Korytarz: 13
    Garaż: 14
    Wiatrołap: 15
  monitored_outputs:
    Syrena_zewn: 1
    Oświetlenie_garaż: 5

  partitions:
    Dom: 1
    Garaż: 2

  status_poll_interval_seconds: 3

tuya:
  status_poll_interval_seconds: 15

  devices:
    gniazdko_salon:
      id: "bf1234567890abcdef"
      ip: "192.168.1.50"
      local_key: "xxxxxxxxxxxxxxxx"
      version: 3.4
      type: socket
    swiatlo_korytarz:
      id: "bf0987654321fedcba"
      ip: "192.168.1.51"
      local_key: "yyyyyyyyyyyyyyyy"
      version: 3.4
      type: dimmer
      dimmer_dp: "3"
      dimmer_range: [10, 1000]
    czujka_okno_salon:
      id: "bfzigbeesub1234567"
      gateway: brama_salon
      cid: "0011223344556677"
      type: socket

  zigbee_gateways:
    brama_salon:
      id: "bfgateway0987654321"
      ip: "192.168.1.55"
      local_key: "zzzzzzzzzzzzzzzz"
      version: 3.4

  cloud:
    access_id: "TWOJ_ACCESS_ID"
    access_key: "TWOJ_ACCESS_KEY"
    api_region: "eu"
    api_endpoint: "https://openapi.tuyaeu.com"
    mq_endpoint: "wss://mqe.tuyaeu.com:8285/"
    camera_device_ids:
      - "bfabcdef1234567890"
      - "bf1122334455667788"

  cloud_devices:
    lampa_taras:
      id: "bfccccccccccccccc"
      category: "kg"
      switch_code: "switch_1"

location:
  latitude: 52.23
  longitude: 21.01

scenes:
  - name: "wieczorne_powitanie"
    actions:
      - {type: tuya_on, device: swiatlo_korytarz, dimmer_level_percent: 30}
      - {type: satel_virtual_input, virtual_input: light_on_living_room}

  - name: "wykryto_intruza"
    actions:
      - {type: tuya_on, device: gniazdko_salon}
      - {type: tuya_on, device: swiatlo_korytarz}
      - {type: satel_output, output_number: 1, state: true}
      - {type: delay, seconds: 2}
      - {type: satel_virtual_input, virtual_input: motion_hall_camera}

  - name: "ochrona_przed_mrozem"
    actions:
      - {type: tuya_on, device: grzalka_garaz}

presence_simulation:
  enabled: false
  devices: [swiatlo_korytarz, gniazdko_salon]
  window:
    start: "sunset"
    end: "23:30"
  min_interval_minutes: 15
  max_interval_minutes: 60

boiler_rules:
  - name: "Ochrona przed mrozem"
    sensor: kociol_temp_zewnetrzna
    condition: below
    threshold: -5
    scene: "ochrona_przed_mrozem"
    cooldown_seconds: 1800

reguły_ruchu:
  - source: satel_zone
    zone_number: 12
    target_device: gniazdko_salon
    duration_seconds: 300
    dimmer_level_percent: null

  - source: satel_zone
    zone_number: 13
    target_device: swiatlo_korytarz
    duration_seconds: 120
    dimmer_level_percent: 2
    time_window:
      start: "sunset-15"
      end: "23:30"

  - source: satel_zone
    zone_number: 14
    target_device: gniazdko_salon
    duration_seconds: 60
    escalation:
      threshold_count: 3
      window_seconds: 120
      escalated_scene: "wykryto_intruza"

  - name: wejscie_do_domu
    source: satel_zone
    zone_number: 3
    target_device: swiatlo_przedpokoj
    duration_seconds: 120
    condition:
      type: and
      conditions:
        - {type: state, key: "satel_input:9", equals: "naruszone"}
        - type: not
          conditions:
            - {type: time_window, start: "22:00", end: "06:00"}
    then_trigger_rule: powiadom_o_wejsciu

  - name: powiadom_o_wejsciu
    source: satel_zone
    zone_number: 3
    scene: "wieczorne_powitanie"

reguły_swiatlo_do_satela:
  - source_device: swiatlo_korytarz
    virtual_input: light_on_living_room

reguły_kamera_alarm:
  - source: unifi_protect
    camera_id: "UNIFI_CAMERA_ID"
    action: virtual_input
    virtual_input: motion_hall_camera
    cooldown_seconds: 60

home_assistant:
  enabled: false
  mqtt_host: "127.0.0.1"
  mqtt_port: 1883
  discovery_prefix: "homeassistant"
  state_topic_prefix: "home/bridge"
  device_name: "Satel-Tuya-eBUS Bridge"

unifi_protect:
  host: "192.168.1.5"
  username: "TWOJ_LOGIN"
  password: "TWOJE_HASLO"
  verify_ssl: false

ebus:
  mqtt_host: "127.0.0.1"
  mqtt_port: 1883

  sensors_file: "sensors.yaml"

dashboard:
  db_path: "bridge_history.db"

  auth:
    username: "admin"
    password_hash: ""
    max_failed_attempts: 5
    lockout_seconds: 300
    allow_basic_auth: true

alarm_rules:
  - name: "Zbyt wysoka temp. zasilania kotła"
    sensor: kociol_temp_zasilania
    condition: above
    threshold: 85
    hysteresis: 2

  - name: "Zbyt niska temp. CWU"
    sensor: kociol_temp_ck
    condition: below
    threshold: 35
    hysteresis: 2

  - name: "Brak danych z kotła (moduł eBUS/ebusd nie odpowiada)"
    sensor: kociol_temp_zasilania
    condition: stale
    max_age_seconds: 600

maintenance:
  purge_enabled: true
  retention_days: 180

  backup_enabled: false
  backup_dir: "backups"
  backup_keep_count: 7

  run_in_process: true
  interval_hours: 24

notifications:
  ntfy_topic_url: "https://ntfy.sh/TWOJ_UNIKALNY_TOPIC"

  grace_seconds: 120
  satel_alarm: true

mqtt_publish:
  enabled: true
  topics:
    satel: "satel"
    tuya: "tuya"

boiler_output:
  mqtt:
    host: "127.0.0.1"
    port: 1883
    topic_prefix: "home/boiler"
  tuya_virtual_device:
    device_id: "TU_WSTAW_ID_WIRTUALNEGO_URZADZENIA"
