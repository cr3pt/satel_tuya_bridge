# Minimalna konfiguracja opcjonalnego brokera mosquitto z docker-compose.yml
# (profil "broker") - TYLKO do testów/domowej sieci zaufanej. Anonimowy
# dostęp bez hasła i TLS - nie wystawiaj tego portu poza LAN.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
