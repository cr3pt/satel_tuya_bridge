sensors:
  - name: kociol_temp_zasilania
    label: "Temperatura zasilania"
    mqtt_topic: "ebusd/bai/FlowTemp"
    targets:
      history: true
      mqtt_publish: true
      tuya_virtual_device: true
      tuya_dp: "101"

  - name: kociol_temp_ck
    label: "Temperatura CWU"
    mqtt_topic: "ebusd/bai/StorageTemp"
    targets:
      history: true
      mqtt_publish: true
      tuya_virtual_device: false
      tuya_dp: ""

  - name: kociol_status_palnika
    label: "Status palnika"
    mqtt_topic: "ebusd/bai/BurnerState"
    targets:
      history: true
      mqtt_publish: false
      tuya_virtual_device: false
      tuya_dp: ""

  - name: kociol_temp_zewnetrzna
    label: "Temperatura zewnętrzna"
    mqtt_topic: "ebusd/bai/OutdoorstempSensor"
    targets:
      history: true
      mqtt_publish: true
      tuya_virtual_device: false
      tuya_dp: ""

  - name: kociol_temp_podlogowa
    label: "Temperatura podłogowa (obwód 1)"
    mqtt_topic: "ebusd/hc1"
    mqtt_field: "TempFloor"
    targets:
      history: true
      mqtt_publish: true
      tuya_virtual_device: false
      tuya_dp: ""
