name: Testy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Projekt nie jest już ograniczony do RPi Zero. Dolna granica to
        # teraz Python 3.12 - twardy wymóg satel-integra>=1.4.0
        # (requires-python >=3.12, patrz requirements.txt), więc 3.11 nie
        # da się już zainstalować (pip install -r requirements-dev.txt by
        # się wywalił). 3.13 to najnowsza stabilna gałąź - testujemy ją
        # razem z 3.12.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Uruchom testy
        run: |
          python -m pytest tests/ --cov=bridge --cov=dashboard --cov-report=term-missing --cov-report=xml

      - name: Wgraj raport pokrycia (artefakt)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprawdź składnię wszystkich plików Python
        run: |
          python -m py_compile bridge/*.py dashboard/*.py main.py tests/*.py
