name: Testy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Ustaw Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Uruchom testy
        run: |
          python -m pytest tests/ --cov=bridge --cov=dashboard --cov-report=term-missing --cov-report=xml

      - name: Wgraj raport pokrycia (artefakt)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  lint-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sprawdź składnię wszystkich plików Python
        run: |
          python -m py_compile bridge/*.py dashboard/*.py main.py tests/*.py
