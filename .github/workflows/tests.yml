name: Testy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 to najstarszy Python realnie spotykany na Raspberry Pi OS
        # (Bullseye), 3.11/3.12 to nowsze obrazy - testujemy oba krańce
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Uruchom testy
        run: |
          python -m pytest tests/ --cov=bridge --cov=dashboard --cov-report=term-missing --cov-report=xml

      - name: Wgraj raport pokrycia (artefakt)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sprawdź składnię wszystkich plików Python
        run: |
          python -m py_compile bridge/*.py dashboard/*.py main.py tests/*.py
