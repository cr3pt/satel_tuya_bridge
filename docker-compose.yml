services:
  bridge:
    build: .
    image: satel-tuya-bridge:latest
    container_name: satel-tuya-bridge
    working_dir: /config
    command: ["python", "/app/main.py", "--config", "config.db"]
    volumes:
      - ./data:/config
    environment:
      - TZ=Europe/Warsaw
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/config/.bridge_heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 90 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    image: satel-tuya-bridge:latest
    container_name: satel-tuya-dashboard
    working_dir: /config
    command: ["python", "-m", "dashboard.app", "--config", "config.db", "--host", "0.0.0.0", "--port", "8090"]
    volumes:
      - ./data:/config
    environment:
      - TZ=Europe/Warsaw
    ports:
      - "8090:8090"
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: satel-tuya-mosquitto
    profiles: ["broker"]
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto-data:/mosquitto/data
    restart: unless-stopped
