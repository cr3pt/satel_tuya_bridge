<div class="nav">
  {% if request.path != '/' %}<a href="/">&larr; Wróć do panelu</a> &nbsp;·&nbsp; {% endif %}
  <a href="/plugins" class="nav-btn {{ 'active' if request.path.startswith('/plugins') else '' }}"><span class="nav-icon">🧩</span>Wtyczki</a>
  <a href="/automations" class="nav-btn {{ 'active' if request.path == '/automations' else '' }}"><span class="nav-icon">🎬</span>Automatyzacje</a>
  <a href="/flows" class="nav-btn {{ 'active' if request.path == '/flows' else '' }}"><span class="nav-icon">🔀</span>Flow</a>
  <a href="/map" class="nav-btn {{ 'active' if request.path == '/map' else '' }}"><span class="nav-icon">🏠</span>Mapa</a>
  <a href="/system" class="nav-btn {{ 'active' if request.path == '/system' else '' }}"><span class="nav-icon">⚙</span>Ogólne</a>
  &nbsp;·&nbsp;
  <a id="authNavLink" href="/login"></a>
</div>
<style>
  .nav { margin-bottom: 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .nav a.nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-size: 15px;
  }
  .nav-btn:hover { background: var(--border); }
  .nav-btn.active { color: var(--text); font-weight: 600; border-color: var(--accent); }
  .nav-icon { font-size: 17px; line-height: 1; }

  .hint-toggle {
    background: none; border: none; padding: 0; margin: 0; cursor: pointer;
    color: var(--accent); font-size: 13px; font-weight: 500; font-family: inherit;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .hint-toggle:hover { text-decoration: underline; }
  .hint-body { margin-top: 6px; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('div.hint').forEach(function (hintEl, idx) {
    if (hintEl.dataset.hintInit) return;
    hintEl.dataset.hintInit = '1';

    var storageKey = 'hint-expanded:' + location.pathname + ':' + idx;
    var expanded = false;
    try { expanded = localStorage.getItem(storageKey) === '1'; } catch (e) { }

    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'hint-toggle';

    var body = document.createElement('div');
    body.className = 'hint-body';
    while (hintEl.firstChild) body.appendChild(hintEl.firstChild);

    var snippetWords = (body.textContent || '').trim().split(/\s+/).filter(Boolean).slice(0, 3);
    var snippet = snippetWords.join(' ');

    function render() {
      toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      toggle.textContent = expanded ? '▾ Zwiń' : ('▸ ' + snippet + '…');
      body.style.display = expanded ? '' : 'none';
    }
    toggle.addEventListener('click', function () {
      expanded = !expanded;
      try { localStorage.setItem(storageKey, expanded ? '1' : '0'); } catch (e) { }
      render();
    });
    render();

    hintEl.appendChild(toggle);
    hintEl.appendChild(body);
  });
});
</script>
